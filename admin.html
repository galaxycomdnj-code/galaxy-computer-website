
<!DOCTYPE html>
<html lang="bn">
<head>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ff6a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Computer | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#101820;margin:0;padding:20px;color:#222}
.container{max-width:600px;margin:30px auto;background:white;padding:24px;border-radius:12px}
h2{color:#f07818}
input,textarea,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:15px}
button{background:#f07818;color:white;border:0;font-weight:bold;cursor:pointer}
.hidden{display:none}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h2>Galaxy Computer</h2>
<h3>Admin Panel</h3>

<div id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
</div>

<div id="panel" class="hidden">
<h3>পণ্য যোগ করুন</h3>
<input id="pname" placeholder="Product Name">
<textarea id="pdesc" placeholder="Product Description"></textarea>
<input id="price" type="number" placeholder="Price">
<input id="category" placeholder="Category">
<input id="pimage" placeholder="Image URL (optional)">
<button id="productBtn">Add Product</button>

<hr>
<h3>সার্ভিস যোগ করুন</h3>
<input id="sname" placeholder="Service Name">
<textarea id="sdesc" placeholder="Service Description"></textarea>
<input id="simage" placeholder="Image URL (optional)">
<button id="serviceBtn">Add Service</button>

<button id="logoutBtn">Logout</button>
</div>
<p id="message"></p>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://wfuvzfiwnpbgbzzeygei.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FMsWzO2LqaTzM8tem94M2w_i3HhnWHR';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const msg = document.getElementById('message');

document.getElementById('loginBtn').onclick = async () => {
  msg.textContent = 'Logging in...';

  const {data,error} = await supabase.auth.signInWithPassword({
    email:document.getElementById('email').value,
    password:document.getElementById('password').value
  });

  if(error){msg.textContent=error.message;return;}

  const {data:admin,error:adminError} = await supabase
    .from('admins')
    .select('user_id')
    .eq('user_id',data.user.id)
    .maybeSingle();

  if(adminError || !admin){
    await supabase.auth.signOut();
    msg.textContent='Admin permission not found.';
    return;
  }

  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  msg.textContent='Login successful!';
};

document.getElementById('productBtn').onclick = async () => {
  const name=document.getElementById('pname').value.trim();
  if(!name){msg.textContent='Product name দিন।';return;}

  const {error}=await supabase.from('products').insert([{
    name,
    description:document.getElementById('pdesc').value,
    price:document.getElementById('price').value || null,
    category:document.getElementById('category').value,
    image_url:document.getElementById('pimage').value || null
  }]);

  msg.textContent=error ? error.message : 'Product added successfully!';
};

document.getElementById('serviceBtn').onclick = async () => {
  const name=document.getElementById('sname').value.trim();
  if(!name){msg.textContent='Service name দিন।';return;}

  const {error}=await supabase.from('services').insert([{
    name,
    description:document.getElementById('sdesc').value,
    image_url:document.getElementById('simage').value || null
  }]);

  msg.textContent=error ? error.message : 'Service added successfully!';
};

document.getElementById('logoutBtn').onclick = async () => {
  await supabase.auth.signOut();
  location.reload();
};
</script>
</body>
</html>
